services:

  # ── Base de données PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ymmo
      POSTGRES_USER: ymmo
      POSTGRES_PASSWORD: ymmopassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymmo -d ymmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend C# ASP.NET Core ──────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ymmo:ymmopassword@db:5432/ymmo
      Jwt__Key: YmmoSuperSecretKey2025FiLRougeB2InfraDevYnov!
      Jwt__Issuer: YmmoAPI
      Jwt__Audience: YmmoApp
      AllowedOrigins: "http://localhost,http://localhost:80"
      PORT: "5068"
    ports:
      - "5068:5068"

  # ── Data service Python FastAPI ──────────────────────────────────────────────
  data-service:
    build: ./data-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ymmo:ymmopassword@db:5432/ymmo
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    ports:
      - "8000:8000"

  # ── Frontend React (nginx) ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - data-service
    ports:
      - "80:80"

volumes:
  postgres_data:
